[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant-data-mcp-server"
version = "0.1.0"
description = "Read-only data and analytics MCP server for AI Assistant"
requires-python = ">=3.14"

dependencies = [
    "mcp==2.2.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.52",
    "psycopg[binary]==3.3.4",
]

[dependency-groups]
test = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]