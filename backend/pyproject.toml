[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant-backend"
version = "0.1.0"
description = "AI Assistant backend"
requires-python = ">=3.14"

dependencies = [
    "fastapi==0.139.0",
    "openai==2.46.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "uvicorn==0.51.0",
]

[dependency-groups]
test = [
    "pytest==9.1.1",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]